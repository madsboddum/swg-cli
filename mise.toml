# Go itself is pinned by the toolchain directive in go.mod, not here. mise reads
# it from there as an exact version, so a newer Go elsewhere on PATH, which the
# directive alone would let win, cannot drift from the one golangci-lint is
# built with.
[settings]
idiomatic_version_file_enable_tools = ["go"]

[tools]
cocogitto = "7.0.0"
golangci-lint = "2.13.2"
goreleaser = "2.18.0"
lefthook = "2.1.12"

# Wire up the git hooks as part of `mise install`, so a fresh clone needs one step.
[hooks]
postinstall = "lefthook install"

[tasks.fmt]
description = "Check formatting"
run = '''
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt needs to be run on:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.build]
description = "Build the swg binary"
run = "go build -o swg ./cmd/swg"

[tasks.release]
description = "Tag the next release, derived from the commit log"
run = "cog bump --auto"

[tasks.release-check]
description = "Validate the GoReleaser config"
run = "goreleaser check"

[tasks.verify]
description = "Everything CI runs"
depends = ["fmt", "vet", "lint", "test", "build"]
