name: Tag

on:
  schedule:
    # 03:37 UTC. GitHub runs scheduled jobs late under load, so treat the time
    # as "some point that night", not a deadline. An off-the-hour minute is
    # less likely to be delayed or dropped than 03:00.
    - cron: "37 3 * * *"
  workflow_dispatch:
    inputs:
      level:
        description: "Version to pick: auto reads the commit log, the rest force a bump"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest

    outputs:
      tagged: ${{ steps.bump.outputs.tagged }}

    steps:
      - uses: actions/checkout@v7
        with:
          # cog walks history back to the last tag to pick the next version.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Identify as the release bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Bump
        id: bump
        env:
          LEVEL: ${{ inputs.level || 'auto' }}
        run: |
          # cog bumps and pushes a tag even when nothing has landed since the
          # last one, so a nightly run on an unchanged main walks the version
          # upwards forever. HEAD already carrying a tag is exactly that case.
          # Stop before cog runs; a forced dispatch may still re-tag on purpose.
          if existing=$(git describe --exact-match --tags HEAD 2>/dev/null); then
            if [ "$LEVEL" = auto ]; then
              echo "tagged=false" >> "$GITHUB_OUTPUT"
              echo "HEAD is already released as $existing."
              exit 0
            fi
            echo "HEAD is already released as $existing; forcing a $LEVEL bump."
          fi

          before=$(git tag --points-at HEAD | wc -l)
          cog bump "--$LEVEL"
          # cog exits 0 without tagging when nothing since the last tag is a
          # feat, fix or breaking change, so ask the tags themselves. Count the
          # tags on HEAD rather than naming one: git describe resolves several
          # tags on one commit to an arbitrary member, not the newest, which is
          # what kept the runaway above out of this job's output.
          if [ "$(git tag --points-at HEAD | wc -l)" = "$before" ]; then
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits."
            exit 0
          fi
          tag=$(git tag --points-at HEAD --sort=-v:refname | head -1)
          # Only release a tag the remote actually has; GoReleaser publishes
          # against origin, so a post-bump hook that failed to push must not
          # look like a successful release.
          git ls-remote --exit-code origin "refs/tags/$tag" > /dev/null
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          echo "Tagged $tag"

  release:
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    # The tag cog just pushed points at this commit, so GoReleaser sees it.
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    secrets: inherit
