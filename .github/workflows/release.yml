name: Release

on:
  push:
    tags:
      - "v*"
  # Called by tag.yml after it pushes a tag. A CI push authenticated with the
  # default GITHUB_TOKEN does not trigger the tag filter above, so the release
  # has to be invoked directly rather than left to fire on its own.
  workflow_call:

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from history, so a shallow clone is not enough.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
