name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # cog needs the base commit present to walk the PR's range.
          fetch-depth: 0
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Check commit messages
        run: cog check --ignore-merge-commits ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set up mise
        uses: jdx/mise-action@v4
      - name: Verify
        run: mise run verify
